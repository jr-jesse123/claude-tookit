name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate marketplace and plugins
        run: node scripts/validate-marketplace.mjs

      - name: Validate mermaid diagrams
        run: node scripts/validate-diagrams.mjs

      - name: Check shipped Python helpers are syntactically valid
        run: |
          shopt -s nullglob globstar
          for f in plugins/**/*.py; do
            echo "checking $f"
            python3 -m py_compile "$f"
          done
